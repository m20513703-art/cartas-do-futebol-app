name: Android emulator startup validation
on:
  workflow_dispatch:
  push:
    branches: [validacao-campeonatos-v135]
permissions:
  contents: read
jobs:
  emulator-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validacao-campeonatos-v135
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies and run regression tests
        run: |
          npm install --no-audit --no-fund
          npm run test:engines
      - name: Build production release APK
        run: |
          npx expo export --platform android --output-dir dist
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
      - name: Boot emulator, install and launch production APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -Eeuo pipefail
            mkdir -p "$GITHUB_WORKSPACE/evidence"
            E="$GITHUB_WORKSPACE/evidence"
            APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
            PKG=com.mmsistemastecnologia.cartasfutebol
            STEP=init
            mark() { STEP="$1"; printf '%s STEP=%s\n' "$(date -Is)" "$STEP" | tee -a "$E/steps.txt"; }
            capture() {
              rc=$?
              trap - EXIT
              set +e
              printf 'exit_code=%s\nlast_step=%s\n' "$rc" "$STEP" > "$E/result.txt"
              adb devices -l > "$E/adb-devices.txt" 2>&1
              adb shell getprop > "$E/getprop.txt" 2>&1
              adb shell getprop sys.boot_completed > "$E/boot-completed.txt" 2>&1
              adb shell pidof "$PKG" > "$E/app-pid.txt" 2>&1
              adb shell dumpsys activity activities > "$E/activity-activities.txt" 2>&1
              adb shell dumpsys activity top > "$E/activity-top.txt" 2>&1
              adb shell dumpsys window windows > "$E/window-windows.txt" 2>&1
              adb logcat -d -v threadtime > "$E/logcat.txt" 2>&1
              adb logcat -d -b crash -v threadtime > "$E/logcat-crash.txt" 2>&1
              adb shell screencap -p /sdcard/futebol-top-screen.png >/dev/null 2>&1
              adb pull /sdcard/futebol-top-screen.png "$E/screen.png" >/dev/null 2>&1
              adb shell uiautomator dump /sdcard/futebol-top-window.xml > "$E/uiautomator-dump.txt" 2>&1
              adb pull /sdcard/futebol-top-window.xml "$E/window.xml" >/dev/null 2>&1
              printf 'diagnostics captured; emulator script exit=%s at %s\n' "$rc" "$STEP" >&2
              exit "$rc"
            }
            trap capture EXIT
            mark 'wait-for-device'
            adb wait-for-device
            mark 'check-boot-completed'
            adb shell getprop sys.boot_completed | grep -q 1
            mark 'clear-logcat-before-install-and-launch'
            adb logcat -c
            mark 'install-apk'
            adb install -r "$APK"
            mark 'launch-launcher-activity'
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            mark 'wait-for-process'
            PID=''
            for i in $(seq 1 60); do
              PID=$(adb shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)
              if [ -n "$PID" ]; then break; fi
              sleep 1
            done
            printf 'pid=%s\n' "$PID" > "$E/launch-pid.txt"
            test -n "$PID"
            mark 'wait-for-first-screen'
            sleep 15
            mark 'capture-ui-and-assertions'
            adb shell dumpsys activity activities > "$E/activity-activities.txt"
            adb shell dumpsys window windows > "$E/window-windows.txt"
            adb shell uiautomator dump /sdcard/futebol-top-window.xml
            adb pull /sdcard/futebol-top-window.xml "$E/window.xml"
            adb shell screencap -p /sdcard/futebol-top-screen.png
            adb pull /sdcard/futebol-top-screen.png "$E/screen.png"
            adb logcat -d -v threadtime > "$E/logcat.txt"
            if grep -E 'FATAL EXCEPTION|Fatal signal|ReactNativeJS.*(Error|error)|Unable to load script' "$E/logcat.txt"; then
              echo 'Fatal/native or React Native JS error detected' >&2
              exit 1
            fi
            test -s "$E/window.xml"
            test -s "$E/screen.png"
            grep -q "$PKG" "$E/activity-activities.txt"
            mark 'pass'
      - name: Upload emulator diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/**
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
