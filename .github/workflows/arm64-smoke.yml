name: Android ARM64 emulator startup validation
on:
  workflow_dispatch:
  push:
    branches: [validacao-campeonatos-v135]
permissions:
  contents: read
jobs:
  arm64-emulator-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validacao-campeonatos-v135
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies and run regression tests
        run: |
          npm install --no-audit --no-fund
          npm run test:engines
      - name: Build validation release APK
        run: |
          npx expo export --platform android --output-dir dist
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease
      - name: Verify validation APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -5
      - name: Report host virtualization support
        run: |
          if [ -e /dev/kvm ]; then
            sudo chown "$USER" /dev/kvm
            echo '/dev/kvm available; ARM64 may still be unaccelerated on x86_64 host.'
          else
            echo 'No /dev/kvm: ARM64 emulator will be unaccelerated; boot timeout is infrastructure, not app crash.'
          fi
      - name: Boot API 35 ARM64 emulator, install, and launch validation APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash "$GITHUB_WORKSPACE/scripts/emulator-smoke.sh"
      - name: Upload ARM64 emulator evidence and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-emulator-startup-evidence
          path: |
            evidence/
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
