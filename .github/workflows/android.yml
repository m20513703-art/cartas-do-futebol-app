name: Android release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project with embedded JS bundle
        run: npx expo prebuild --platform android --no-install
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Inspect APK contents, manifest, and signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -3
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|res/.*/(ic_launcher|adaptive_icon)'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -5
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Cartas-do-Futebol-v1.0.1-release.apk
      - name: Install and launch on Android emulator; capture visual smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install release/Cartas-do-Futebol-v1.0.1-release.apk
            adb shell am force-stop com.mmsistemastecnologia.cartasfutebol || true
            adb shell monkey -p com.mmsistemastecnologia.cartasfutebol 1
            sleep 15
            adb shell screencap -p /sdcard/cartas-screen.png
            adb pull /sdcard/cartas-screen.png release/cartas-screen.png
            adb logcat -d -t 6000 > release/logcat.txt
            ! grep -E 'FATAL EXCEPTION|Unable to load script|Could not connect to development server|ReactNativeJS.*(Error|TypeError)' release/logcat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cartas-futebol-release-evidence
          path: release/
          if-no-files-found: error
      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.1-release
          name: Cartas do Futebol v1.0.1 (APK Release)
          files: release/Cartas-do-Futebol-v1.0.1-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
