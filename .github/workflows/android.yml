name: Android validation APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check isolated tournament engines
        run: npm run test:engines
      - name: Transform app bundle
        run: npx expo export --platform android --output-dir dist
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Validate APK package and signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -3
          unzip -l "$APK" | grep 'assets/index.android.bundle'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -5
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          test "$(stat -c%s "$APK")" -gt 30000000
      - name: Store validation artifact (no release from this branch)
        uses: actions/upload-artifact@v4
        with:
          name: futebol-top-v1.3.5-validation
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
