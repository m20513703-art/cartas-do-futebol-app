name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project with embedded app bundle
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Verify APK package, logo and signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|ic_launcher|adaptive_icon'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -5
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Futebol-Top-v1.0.4-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: futebol-top-v1.0.4-apk
          path: release/Futebol-Top-v1.0.4-release.apk
          if-no-files-found: error
      - name: Publish direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.4-release
          name: Futebol Top v1.0.4
          files: release/Futebol-Top-v1.0.4-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
