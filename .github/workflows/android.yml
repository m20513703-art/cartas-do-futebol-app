name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease
        working-directory: android
      - name: Validate signed APK and embedded bundle
        id: check
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep 'assets/index.android.bundle'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -5
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Futebol-Top-v1.0.3-release.apk
          echo passed=true >> "$GITHUB_OUTPUT"
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install release/Futebol-Top-v1.0.3-release.apk
            adb shell monkey -p com.mmsistemastecnologia.cartasfutebol 1
            sleep 15
            adb logcat -d -t 6000 > release/logcat.txt
            ! grep -E 'FATAL EXCEPTION|Unable to load script|Could not connect to development server' release/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: futebol-top-build-evidence
          path: release/
          if-no-files-found: warn
      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.passed == 'true'
        with:
          tag_name: apk-v1.0.3-release
          name: Futebol Top v1.0.3
          files: release/Futebol-Top-v1.0.3-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
