name: Android release APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project with embedded JS bundle
        run: npx expo prebuild --platform android --no-install
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Inspect APK contents, manifest, and signature
        id: staticcheck
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -3
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|res/.*/(ic_launcher|adaptive_icon)'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -5
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/Futebol-Top-v1.0.3-release.apk
          echo 'passed=true' >> "$GITHUB_OUTPUT"
      - name: Optional Android emulator smoke test
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            mkdir -p "$GITHUB_WORKSPACE/release"
            adb wait-for-device
            ready=0
            for attempt in $(seq 1 36); do
              state=$(adb get-state 2>/dev/null || true)
              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$state" = device ] && [ "$boot" = 1 ]; then ready=1; break; fi
              adb reconnect offline >/dev/null 2>&1 || true
              sleep 5
            done
            if [ "$ready" != 1 ]; then
              echo 'Emulator unavailable; static APK checks passed.'
              adb devices -l > "$GITHUB_WORKSPACE/release/adb-devices.txt" || true
              exit 1
            fi
            adb logcat -c
            adb install "$GITHUB_WORKSPACE/release/Futebol-Top-v1.0.3-release.apk"
            adb shell am force-stop com.mmsistemastecnologia.cartasfutebol || true
            adb shell monkey -p com.mmsistemastecnologia.cartasfutebol 1
            sleep 20
            adb logcat -d -t 10000 > "$GITHUB_WORKSPACE/release/logcat.txt"
            if grep -E 'FATAL EXCEPTION|Unable to load script|Could not connect to development server' "$GITHUB_WORKSPACE/release/logcat.txt"; then exit 1; fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futebol-top-release-evidence
          path: release/
          if-no-files-found: warn
      - name: Publish direct APK release
        if: steps.staticcheck.outputs.passed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.3-release
          name: Futebol Top v1.0.3 (APK Release)
          files: release/Futebol-Top-v1.0.3-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
