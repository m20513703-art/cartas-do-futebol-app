name: Android emulator startup validation
on:
  workflow_dispatch:
  push:
    branches: [validacao-campeonatos-v135, prototipo-modo-tecnico]
permissions:
  contents: read
jobs:
  emulator-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies and run regression tests
        run: |
          npm install --no-audit --no-fund
          npm run test:engines
      - name: Build production release APK
        run: |
          npx expo export --platform android --output-dir dist
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease
      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -5
      - name: Enable KVM access
        run: sudo chown "$USER" /dev/kvm
      - name: Boot emulator, install and launch preview APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/scripts/emulator-smoke.sh"
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-preview-emulator-evidence
          path: |
            evidence/
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
