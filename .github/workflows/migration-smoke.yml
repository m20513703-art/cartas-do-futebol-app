name: Android saved-career migration smoke test
on:
  workflow_dispatch:
  push:
    branches: [validacao-campeonatos-v135]
permissions:
  contents: read
jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validacao-campeonatos-v135
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run progression regression tests
        run: |
          npm install --no-audit --no-fund
          npm run test:engines
      - name: Build fixed release APK
        run: |
          npx expo export --platform android --output-dir dist
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease
      - name: Enable KVM access
        run: sudo chown "$USER" /dev/kvm
      - name: Install previous official APK, create a legacy career, upgrade and verify migration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/scripts/migration-smoke.sh"
      - name: Upload migration logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-career-migration-evidence
          path: evidence/
          if-no-files-found: warn
